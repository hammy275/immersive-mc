plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        url = "https://cursemaven.com"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = "https://jitpack.io/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    api "curse.maven:vivecraft-667903:${vivecraft_fabric_file_id}"

    api "com.terraformersmc:modmenu:18.0.0-beta.1"
    compileOnly "curse.maven:lootr-615106:7919279" // Waiting on 1.21.11 build
    compileOnly "curse.maven:clothconfigapi-348521:7817582" // lootr dependency

    compileOnly "curse.maven:inventoryprofilesnext-495267:8038912"
    compileOnly "curse.maven:libipn-679177:8038718" // Inventory Profiles Next dependency
    compileOnly "curse.maven:fabriclanguagekotlin-308769:7976268" // Inventory Profiles Next dependency
}

loom {
    def aw = project(':fabric').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

javadoc {
    // Ignore .md files used for extra documentation added among code not intended for the Javadocs
    exclude "**/*.md"
}
